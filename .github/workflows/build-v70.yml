name: Build Nexus v71 keyboard fix
on:
  push:
    branches: [build-v70-installer]
    paths: ['.github/workflows/build-v70.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare keyboard fix
        shell: pwsh
        run: |
          @'
          import hashlib, json, os, shutil, urllib.request, zipfile
          from pathlib import Path
          root = Path.cwd()
          download = Path(os.environ['RUNNER_TEMP']) / 'nexus-source'
          download.mkdir()
          archive = download / 'source.zip'
          with urllib.request.urlopen('https://github.com/1245047209-dotcom/1/releases/download/v70/Nexus-v70-source.zip', timeout=60) as response, archive.open('wb') as target:
              shutil.copyfileobj(response, target)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '8127d40f3318fa42ae351e5bfc19558531f029430125da015c448e5383e9f249'
          extracted = download / 'extracted'
          extracted.mkdir()
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  assert (extracted / entry.filename).resolve().is_relative_to(extracted.resolve())
              source.extractall(extracted)
          app = extracted / 'Nexus-v70-source'
          manifest = json.loads((app / 'SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          for name, digest in manifest['files'].items():
              assert hashlib.sha256((app / name).read_bytes()).hexdigest() == digest
          (app / 'SOURCE_MANIFEST.json').unlink()
          panel = app / 'my_devices.py'
          text = panel.read_text(encoding='utf-8')
          before = '            kind = product_kind(device)' + chr(10) + '            yield' + chr(10) + '            photo = self.fitted_product'
          after = '            kind = product_kind(device)' + chr(10) + '            if not compact and kind == "keyboard":' + chr(10) + '                image_width, image_height = min(card_width - 360, 620), 260' + chr(10) + '                image_center_x, image_center_y = x1 + card_width * .58, y1 + 205' + chr(10) + '            yield' + chr(10) + '            photo = self.fitted_product'
          assert text.count(before) == 1
          panel.write_text(text.replace(before, after), encoding='utf-8')
          (app / 'VERSION').write_text('v71' + chr(10), encoding='utf-8')
          shutil.rmtree(root / 'app')
          shutil.copytree(app, root / 'app')
          meta_path = root / 'release-input/release.json'
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          meta.update(tag='v71', installer='Nexus-v71-Windows-x64-Setup.exe', source='Nexus-v71-source.zip')
          meta_path.write_text(json.dumps(meta), encoding='utf-8')
          stage = root / 'scripts/stage_payload.py'
          text = stage.read_text(encoding='utf-8')
          stage.write_text(text.replace('for item in baseline.iterdir():', 'for item in [baseline / "runtime"]:'), encoding='utf-8')
          build = root / 'scripts/build_windows_release.ps1'
          text = build.read_text(encoding='utf-8').replace('python (Join-Path', 'python -I (Join-Path').replace('python -c ', 'python -I -c ')
          build.write_text(text, encoding='utf-8')
          '@ | python -I -
          if ($LASTEXITCODE -ne 0) { throw 'Source preparation failed' }
      - name: Build and test installer
        shell: pwsh
        run: ./scripts/build_windows_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-v71-verified-release
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nexus-v71-verified-release
          path: dist
      - name: Publish keyboard size fix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check Nexus-v71-SHA256.txt
          sha256sum --check Nexus-v71-source.zip.sha256
          gh release create v71 ./* --title "Nexus v71 - Keyboard layout fix" --notes "Restore the large keyboard image on a full-width overview card. Preserve image proportions and compact layouts. Includes Windows installer and complete source." --latest
