name: Publish Nexus update
on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', 'release-input/**', '.github/workflows/publish-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify installer, source and upgrade behavior
        shell: pwsh
        run: ./scripts/build_windows_release.ps1
      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-verified-release
          path: dist/*
          if-no-files-found: error
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = (Get-Content release-input/release.json -Raw | ConvertFrom-Json).tag
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This version already exists; never overwrite a published release.' }
          $artifacts = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $tag @artifacts --draft --target $env:GITHUB_SHA --title "Nexus $tag" --notes-file release-input/notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
